name: Nitrogen

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bindings:
    name: Nitro bindings are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn nitrogen
      - name: Fail if the committed bindings changed
        run: git diff --exit-code -- nitrogen
